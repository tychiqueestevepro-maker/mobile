name: Backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Deno
        run: |
          for i in 1 2 3; do curl -fsSL https://deno.land/install.sh | sh && break || sleep 5; done
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
      - name: Verify Deno
        run: deno --version
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local stack
        run: supabase start
      - name: Reset database
        run: supabase db reset
      - name: Test database invariants and RLS
        run: supabase test db supabase/tests/database
      - name: Check formatting
        run: deno fmt --check supabase/functions
      - name: Lint functions
        run: deno lint --config supabase/functions/deno.json supabase/functions
      - name: Type-check functions
        run: >-
          deno check
          --config supabase/functions/deno.json
          supabase/functions/_shared/*.ts
          supabase/functions/*/index.ts
      - name: Test functions
        run: deno test --config supabase/functions/deno.json --allow-env supabase/functions/tests
      - name: Verify consumer copy
        run: node scripts/check-consumer-copy.mjs
      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
